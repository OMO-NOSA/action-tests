name: "Pipeline 606a8733-29ca-4786-b970-89e3122a0b1e"

on:
  workflow_dispatch:
    inputs:
      pipeline_id:
        description: 'Pipeline ID'
        required: true
        type: string
        default: '606a8733-29ca-4786-b970-89e3122a0b1e'
      repo_url:
        description: 'Repository URL'
        required: true
        type: string
      branch:
        description: 'Branch name'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: false
        type: string
        default: 'staging'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Pipeline execution started
      run: |
        echo "Pipeline ${{ github.event.inputs.pipeline_id }} triggered!"
        echo "Repository: ${{ github.event.inputs.repo_url }}"
        echo "Branch: ${{ github.event.inputs.branch }}"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Started at: $(date)"
        
    - name: Install Dependencies
      run: |
        echo "Executing: npm ci --only=production"
        npm ci --only=production
        echo "Step completed successfully"

    - name: Run Unit Tests
      run: |
        echo "Executing: npm run test:unit"
        npm run test:unit
        echo "Step completed successfully"

    - name: Build Docker Image
      run: |
        echo "Building Docker image from ./Dockerfile.prod"
        echo "Target ECR repository: production-app-repo"
        echo "Simulating Docker build..."
        sleep 3
        echo "Docker build completed successfully"

    - name: Deploy to Staging
      run: |
        echo "Deploying using manifest: ./k8s/staging-deployment.yaml"
        echo "Simulating Kubernetes deployment..."
        sleep 2
        echo "Deployment completed successfully"

    - name: Deploy to Production
      run: |
        echo "Deploying using manifest: ./k8s/production-deployment.yaml"
        echo "Simulating Kubernetes deployment..."
        sleep 2
        echo "Deployment completed successfully"

        
    - name: Pipeline execution completed
      run: |
        echo "Pipeline ${{ github.event.inputs.pipeline_id }} completed successfully!"
        echo "Finished at: $(date)"
